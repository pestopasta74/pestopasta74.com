---
layout: default
---
<section class="page-header fade-in">
  <h1>{{ page.title }}</h1>
  <p class="blog-meta">
    <span class="blog-date">{{ page.date | date: "%B %d, %Y" }}</span>
    {% if page.categories %}
    <span class="blog-category">{{ page.categories | join: ", " }}</span>
    {% endif %}
  </p>
</section>

<article class="blog-post-content fade-in">
  {{ content }}
</article>

<section class="newsletter fade-in">
  <div class="newsletter-content">
    <h2>Subscribe to My Newsletter</h2>
    <p>Get the latest posts and updates delivered straight to your inbox.</p>
    <form class="newsletter-form">
      <input type="email" placeholder="Your email address" required>
      <button type="submit" class="btn">Subscribe</button>
    </form>
  </div>
</section>
